reason = "qs DoS via @stryker-mutator/core; dev-only, no attacker-controlled input"

# Waiting on a fix to clear `minimumReleaseAge` (30 days). Each carries
# `ignoreUntil`: the day after its fix becomes installable. Past that date
# osv-scanner reports it again and `src/driftGuard.test.ts` fails the commit
# gate, so the bump cannot be forgotten.

